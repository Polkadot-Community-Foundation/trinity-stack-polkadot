name: Check descriptor

on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dotns matches the protocol registry
        run: node scripts/check-dotns.mjs model.json
      - name: validUntil is more than 14 days away
        if: ${{ !cancelled() }}
        run: node scripts/check-valid-until.mjs model.json
